name: Build hacktv-gui

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build native libraries (x64)
        shell: cmd
        run: |
          msbuild ConsoleCtrl\ConsoleCtrl.slnx /m /p:Configuration=Release /p:Platform=x64

      - name: Build native libraries (ARM64)
        shell: cmd
        run: |
          msbuild ConsoleCtrl\ConsoleCtrl.slnx /m /p:Configuration=Release /p:Platform=ARM64

      # Don't use the built files, just want to be sure they still compile
      # We'll later use a set that has been signed
      
      #- name: Copy native libraries
      #  shell: pwsh
      #  run: |
      #    $destination = "src/main/resources/ie/bops/resources/native"
      #    New-Item -ItemType Directory -Force -Path $destination | Out-Null
      #    Copy-Item "ConsoleCtrl\x64\Release\ConsoleCtrl.dll" "$destination\ConsoleCtrl_amd64.dll"
      #    Copy-Item "ConsoleCtrl\ARM64\Release\ConsoleCtrl.dll" "$destination\ConsoleCtrl_aarch64.dll"

      - name: Build Windows launcher (x64)
        shell: pwsh
        run: |
          msbuild launcher\launcher.slnx /m /p:Configuration=Release /p:Platform=x64

      - name: Build Windows launcher (ARM64)
        shell: pwsh
        run: |
          msbuild launcher\launcher.slnx /m /p:Configuration=Release /p:Platform=ARM64
      
      #- name: Copy launcher binaries
      #  shell: pwsh
      #  run: |
      #    New-Item -ItemType Directory -Force -Path "target"
      #    Copy-Item "launcher\x64\Release\hacktv-gui.exe" "target\hacktv-gui_amd64.exe"
      #    Copy-Item "launcher\ARM64\Release\hacktv-gui.exe" "target\hacktv-gui_arm64.exe"

      - name: Download signed artifacts
        run: |
          $destination = "src/main/resources/ie/bops/resources/native"
          $downloadHash = "752BC316F254B58EE4B556A623ECFF55908E99ED44783AC81039C0EA9B243235"
          New-Item -ItemType Directory -Force -Path "target" Out-Null
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri https://download.bops.ie/hacktv-gui/buildfiles/signed.zip -OutFile .\signed.zip -UseBasicParsing -ErrorAction Stop
          if (!(Test-Path .\signed.zip)) {
              throw "Unable to download signed artifacts"
          }
          if ((Get-FileHash .\signed.zip).Hash -ne $downloadHash) {
              throw "Error downloading signed artifacts: hash mismatch"
          } 
          Expand-Archive .\signed.zip -DestinationPath .
          Copy-Item "ConsoleCtrl_amd64.dll" "$destination"
          Copy-Item "ConsoleCtrl_aarch64.dll" "$destination"
          Copy-Item "hacktv-gui_amd64.exe" "target"
          Copy-Item "hacktv-gui_arm64.exe" "target"
          Remove-Item .\signed.zip

      - name: Build hacktv-gui
        run: mvn package

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: hacktv-gui
          path: |
            target/*.jar
            target/*.exe
            target/lib/
            target/licenses/

      - name: Check out download repository
        uses: actions/checkout@v5
        with:
          repository: steeviebops/download.bops.ie
          token: ${{ secrets.DOWNLOAD_REPO_TOKEN }}
          path: download-repo

      - name: Update download files
        shell: pwsh
        run: |
          $destination = "download-repo/hacktv-gui"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item "src/main/resources/ie/bops/resources/captainjack.ini" `
              "$destination/captainjack.ini"
          Copy-Item "src/main/resources/ie/bops/resources/fsphil.ini" `
              "$destination/fsphil.ini"
          Copy-Item "src/main/resources/ie/bops/resources/bandplans.ini" `
              "$destination/bandplans.ini"

      - name: Commit updated download files
        shell: pwsh
        working-directory: download-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hacktv-gui/
          if (git diff --cached --quiet) {
              Write-Host "No changes to commit."
              exit 0
          }
          git commit -m "Update hacktv-gui configuration files"
          git push
          
