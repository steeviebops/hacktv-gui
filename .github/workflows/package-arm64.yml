name: Package hacktv-gui for Windows (ARM64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
      run_id:
        description: "Build workflow run ID (leave blank for latest successful build)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  find-build:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.build.outputs.run_id }}

    steps:        
      - name: Find build
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "Using specified build run: ${{ inputs.run_id }}"
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Finding latest successful Build hacktv-gui run..."

          run_id=$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow build.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$run_id" ]; then
            echo "No successful build found."
            exit 1
          fi

          echo "Latest successful build: $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  package:
    needs: find-build
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: hacktv-gui
          path: target
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.find-build.outputs.run_id }}

      - name: Download Temurin JRE
        shell: pwsh
        run: |
          $url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.9%2B10/OpenJDK21U-jre_aarch64_windows_hotspot_21.0.9_10.zip"
          $zip = "$env:RUNNER_TEMP\temurin-jre.zip"
          $destination = "target\jre"
          $extract = "$env:RUNNER_TEMP\temurin-jre"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract
          $jreRoot = Get-ChildItem $extract -Directory | Select-Object -First 1
          Copy-Item "$($jreRoot.FullName)\*" $destination -Recurse

      - name: Select launcher
        shell: pwsh
        run: |
           Rename-Item "target\hacktv-gui_arm64.exe" "hacktv-gui.exe"
           Remove-Item "target\hacktv-gui_amd64.exe"
          
      - name: Install NSIS
        id: nsis
        uses: negrutiu/nsis-install@v2

      - name: Show NSIS info
        run: |
          echo "NSIS dir: ${{ steps.nsis.outputs.instdir }}"
          echo "NSIS version: ${{ steps.nsis.outputs.version }}"
          echo "NSIS arch: ${{ steps.nsis.outputs.arch }}"

      - name: Build installer
        run: |
          Copy-Item scripts\hacktv-gui_setup.nsi target
          Push-Location target
          makensis /DVERSION="${{ inputs.version }}" /DARCH=arm64 hacktv-gui_setup.nsi
          Rename-Item hacktv-gui_setup.exe hacktv-gui_setup_arm64.exe
          
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: hacktv-gui_setup_arm64
          path: target/hacktv-gui_setup_arm64.exe
          
